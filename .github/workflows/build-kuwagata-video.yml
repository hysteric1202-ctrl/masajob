name: Build Kuwagata Dual Educational Videos

on:
  push:
    paths:
      - '.github/workflows/build-kuwagata-video.yml'
      - 'scripts/build_kuwagata_dual.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow requests 'numpy<2' japanmap opencv-python-headless
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Reconstruct and verify builder
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          names = [
              'scripts/build_kuwagata_dual.part01',
              'scripts/build_kuwagata_dual.part02',
              'scripts/build_kuwagata_dual.part03a',
              'scripts/build_kuwagata_dual.part03b',
              'scripts/build_kuwagata_dual.part04',
              'scripts/build_kuwagata_dual.part05',
          ]
          chunks = [Path(name).read_text(encoding='utf-8').strip() for name in names]
          payload = ''.join(chunks)
          source = gzip.decompress(base64.b64decode(payload, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'a2162d5e3b5eaa69afe7bb3d0f506cac8a5c18ea895b24e2ce3d126e63aac848'
          print('source bytes:', len(source), 'sha256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA256 mismatch: {digest} != {expected}')
          Path('/tmp/build_kuwagata_dual.py').write_bytes(source)
          PY

      - name: Harden Wikimedia Commons download logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/build_kuwagata_dual.py')
          s = p.read_text(encoding='utf-8')
          old = '''    url = info.get("thumburl") or info["url"]
    img = requests.get(url, headers=headers, timeout=60)
    img.raise_for_status()
    out_path.write_bytes(img.content)
'''
          new = '''    url = info.get("thumburl") or info["url"]
    from urllib.parse import quote
    import time
    clean_thumb = url.split("?", 1)[0]
    clean_original = info["url"].split("?", 1)[0]
    candidates = [
        clean_thumb,
        f"https://commons.wikimedia.org/w/thumb.php?f={quote(file_name, safe='')}&w={width}",
        f"https://commons.wikimedia.org/wiki/Special:Redirect/file/{quote(file_name, safe='')}?width={width}",
    ]
    if not file_name.lower().endswith(".svg"):
        candidates.append(clean_original)
    session = requests.Session()
    session.headers.update({
        "User-Agent": "KuwagataEducationVideo/1.0 (https://github.com/hysteric1202-ctrl/masajob; educational use)",
        "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
        "Referer": "https://commons.wikimedia.org/",
    })
    last_error = None
    downloaded = False
    for candidate in dict.fromkeys(candidates):
        for attempt in range(7):
            try:
                img = session.get(candidate, timeout=120, allow_redirects=True)
                ctype = img.headers.get("content-type", "").lower()
                if img.status_code == 200 and ctype.startswith("image/") and len(img.content) > 1000:
                    out_path.write_bytes(img.content)
                    url = candidate
                    downloaded = True
                    break
                last_error = RuntimeError(
                    f"HTTP {img.status_code}; type={ctype}; bytes={len(img.content)}; url={candidate}"
                )
                retry_after = img.headers.get("Retry-After")
                wait = int(retry_after) if retry_after and retry_after.isdigit() else min(4 * (attempt + 1), 24)
                time.sleep(wait)
            except Exception as exc:
                last_error = exc
                time.sleep(min(4 * (attempt + 1), 24))
        if downloaded:
            break
    if not downloaded:
        raise RuntimeError(f"Could not download {file_name}: {last_error}")
    time.sleep(2)
'''
          if old not in s:
              raise SystemExit('download block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile /tmp/build_kuwagata_dual.py

      - name: Build 10-minute PC and smartphone editions
        run: python /tmp/build_kuwagata_dual.py

      - name: Verify deliverables
        run: |
          find output -maxdepth 1 -type f -printf '%f | %s bytes\n' | sort
          cat output/クワガタ分布_QA.json
          test -s output/クワガタ分布_通常版.mp4
          test -s output/クワガタ分布_スマホ版.mp4

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: kuwagata-dual-final
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
