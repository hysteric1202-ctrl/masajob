name: Build Kuwagata Dual Educational Videos

on:
  push:
    paths:
      - '.github/workflows/build-kuwagata-video.yml'
      - 'scripts/build_kuwagata_dual.part*'
      - 'scripts/patch_commons.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow requests 'numpy<2' japanmap opencv-python-headless
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Reconstruct and verify builder
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          names = [
              'scripts/build_kuwagata_dual.part01',
              'scripts/build_kuwagata_dual.part02',
              'scripts/build_kuwagata_dual.part03a',
              'scripts/build_kuwagata_dual.part03b',
              'scripts/build_kuwagata_dual.part04',
              'scripts/build_kuwagata_dual.part05',
          ]
          chunks = [Path(name).read_text(encoding='utf-8').strip() for name in names]
          payload = ''.join(chunks)
          source = gzip.decompress(base64.b64decode(payload, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'a2162d5e3b5eaa69afe7bb3d0f506cac8a5c18ea895b24e2ce3d126e63aac848'
          print('source bytes:', len(source), 'sha256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA256 mismatch: {digest} != {expected}')
          Path('/tmp/build_kuwagata_dual.py').write_bytes(source)
          PY
          python scripts/patch_commons.py /tmp/build_kuwagata_dual.py
          python -m py_compile /tmp/build_kuwagata_dual.py

      - name: Build 10-minute PC and smartphone editions
        run: python /tmp/build_kuwagata_dual.py

      - name: Verify deliverables
        run: |
          find output -maxdepth 1 -type f -printf '%f | %s bytes\n' | sort
          cat output/クワガタ分布_QA.json
          test -s output/クワガタ分布_通常版.mp4
          test -s output/クワガタ分布_スマホ版.mp4

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: kuwagata-dual-final
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
