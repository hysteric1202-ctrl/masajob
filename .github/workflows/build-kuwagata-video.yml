name: Build Kuwagata Dual Educational Videos

on:
  push:
    paths:
      - '.github/workflows/build-kuwagata-video.yml'
      - 'scripts/build_kuwagata_dual.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow requests 'numpy<2' japanmap opencv-python-headless
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Reconstruct and verify builder
        run: |
          cat scripts/build_kuwagata_dual.part* | tr -d '\r\n' | base64 --decode | gzip --decompress > /tmp/build_kuwagata_dual.py
          echo 'a2162d5e3b5eaa69afe7bb3d0f506cac8a5c18ea895b24e2ce3d126e63aac848  /tmp/build_kuwagata_dual.py' | sha256sum --check --strict
          python -m py_compile /tmp/build_kuwagata_dual.py

      - name: Build 10-minute PC and smartphone editions
        run: python /tmp/build_kuwagata_dual.py

      - name: Verify deliverables
        run: |
          find output -maxdepth 1 -type f -printf '%f | %s bytes\n' | sort
          cat output/クワガタ分布_QA.json
          test -s output/クワガタ分布_通常版.mp4
          test -s output/クワガタ分布_スマホ版.mp4

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: kuwagata-dual-final
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
