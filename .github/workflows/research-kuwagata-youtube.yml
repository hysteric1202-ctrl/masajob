name: Research Kuwagata Children Videos

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/research_kuwagata_youtube.py'
      - '.github/workflows/research-kuwagata-youtube.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow requests opencv-python-headless
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Research reference and related YouTube videos
        run: python scripts/research_kuwagata_youtube.py

      - name: List outputs
        run: find research_kuwagata -maxdepth 2 -type f -printf '%p | %s bytes\n' | sort

      - name: Upload research package
        uses: actions/upload-artifact@v4
        with:
          name: kuwagata-youtube-research
          path: research_kuwagata/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
