name: Export Kuwagata Pilot Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-kw4-builder.yml'
      - 'scripts/build_kw4_pilot.py.gz.b64'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode builder
        run: |
          mkdir -p exported_builder
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          payload = Path('scripts/build_kw4_pilot.py.gz.b64').read_text(encoding='utf-8').strip()
          source = gzip.decompress(base64.b64decode(payload, validate=True))
          out = Path('exported_builder/build_kw4_pilot.py')
          out.write_bytes(source)
          print('bytes', len(source), 'sha256', hashlib.sha256(source).hexdigest())
          PY
          python -m py_compile exported_builder/build_kw4_pilot.py
          sed -n '1,260p' exported_builder/build_kw4_pilot.py > exported_builder/preview.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kw4-builder-source
          path: exported_builder/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
