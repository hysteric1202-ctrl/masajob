              (15.25,18.15,'きの うえを、のぼっているよ。'),
              (18.30,21.70,'おおきな あご、かっこいい！'),
              (23.10,26.10,'これは、ノコギリクワガタ。'),
              (26.30,29.75,'ぎざぎざの おおあごが、めじるし！'),
              (29.95,33.25,'からだは、あかちゃいろの ことも あるよ。'),
              (34.05,37.25,'にほんの、いろいろな もりに いるよ。'),
