name: Generate Kuwagata 10min Child Audio v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-kuwagata-10min-audio-v1.yml'

concurrency:
  group: kuwagata-10min-audio-v1
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run --rm -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:50021/version; then
              echo
              echo 'VOICEVOX ready.'
              exit 0
            fi
            sleep 3
          done
          docker logs voicevox || true
          exit 1

      - name: Generate narration, music, SFX, SRT
        run: |
          mkdir -p output work/voice
          python - <<'PY'
          from __future__ import annotations
          import json, math, subprocess, time, wave
          from pathlib import Path
          import numpy as np
          import requests

          DURATION = 600.0
          SR = 48000
          OUT = Path('output')
          WORK = Path('work')
          BASE = 'http://127.0.0.1:50021'

          UTTERANCES = [
