              (76.00,80.20,'でも、げんきに てくてく あるくよ。'),
              (82.00,86.25,'おおあごは、まっすぐで、すっきり。'),
              (88.00,92.20,'よるになると、きの じゅえきに あつまるよ。'),
              (96.00,100.20,'ほっかいどうから、きゅうしゅうまで。'),
              (102.00,106.30,'にほんの いろいろな ところに いるんだ。'),
              (108.00,112.40,'まちの ちかくの はやしでも、みつかることが あるよ。'),
