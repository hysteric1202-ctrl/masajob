name: Export Kuwagata Corrected Assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-kuwagata-corrected-assets.yml'
      - 'scripts/fetch_kuwagata_revision_v3_assets.py'

concurrency:
  group: export-kuwagata-corrected-assets
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk librsvg2-bin

      - name: Download validated source packs
        run: |
          mkdir -p incoming/pro incoming/images
          gh run download 31288295927 --repo '${{ github.repository }}' --name kw-pro-assets --dir incoming/pro
          gh run download 31288093670 --repo '${{ github.repository }}' --name kw-exact-images --dir incoming/images

      - name: Assemble corrected asset package
        run: |
          python scripts/fetch_kuwagata_revision_v3_assets.py \
            --images-dir incoming/images \
            --pro-dir incoming/pro \
            --out corrected_assets
          find corrected_assets -maxdepth 1 -type f -printf '%f | %s bytes\n' | sort
          cat corrected_assets/revision_asset_manifest.json

      - name: Upload corrected assets
        uses: actions/upload-artifact@v4
        with:
          name: kuwagata-corrected-assets-v1
          path: corrected_assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
