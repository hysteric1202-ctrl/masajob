name: Build 4-Year-Old Kuwagata TV Pilot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kw4-pilot.yml'
      - 'scripts/build_kw4_pilot.py.gz.b64'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow 'numpy<2'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Reconstruct pilot builder
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          payload = Path('scripts/build_kw4_pilot.py.gz.b64').read_text(encoding='utf-8').strip()
          source = gzip.decompress(base64.b64decode(payload, validate=True))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'a99f42f168963c425fb1f2cb57ecd1d432342935c994b7573d5cc596d315bb93'
          print('builder bytes:', len(source), 'sha256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA256 mismatch: {digest} != {expected}')
          Path('/tmp/build_kw4_pilot.py').write_bytes(source)
          PY
          python -m py_compile /tmp/build_kw4_pilot.py

      - name: Build PC and smartphone pilot videos
        run: |
          python /tmp/build_kw4_pilot.py \
            --source final/Kuwagata_Habitat_Guide_JP.mp4 \
            --output output_kw4 \
            --work build_kw4

      - name: Verify output files
        run: |
          find output_kw4 -maxdepth 1 -type f -printf '%f | %s bytes\n' | sort
          test -s output_kw4/Kuwagata_TVStyle_Pilot_PC_1280x720.mp4
          test -s output_kw4/Kuwagata_TVStyle_Pilot_Mobile_720x1280.mp4
          test -s output_kw4/Kuwagata_TVStyle_Pilot_QA.json
          cat output_kw4/Kuwagata_TVStyle_Pilot_QA.json

      - name: Upload pilot deliverables
        uses: actions/upload-artifact@v4
        with:
          name: kuwagata-tvstyle-pilot-v1
          path: output_kw4/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
