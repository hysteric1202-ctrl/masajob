name: Download Exact Kuwagata Images

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/download_kw_images_only.py'
      - '.github/workflows/download-kw-images-only.yml'

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/download_kw_images_only.py
      - uses: actions/upload-artifact@v4
        with:
          name: kw-exact-images
          path: kw_image_assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
